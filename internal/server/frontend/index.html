<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CtxHive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
    .result-card {
        border: 1px solid #dee2e6;
        border-radius: 0.5rem;
        padding: 1.25rem;
        margin-bottom: 1rem;
        background: #fff;
    }
    .result-card:last-child { margin-bottom: 0; }
    .result-card .score-badge {
        font-size: 0.8rem;
        white-space: nowrap;
    }
    .tag-chip {
        display: inline-block;
        background: #eef2f7;
        color: #495057;
        border-radius: 999px;
        padding: 0.15rem 0.6rem;
        font-size: 0.75rem;
        margin-right: 0.35rem;
        margin-bottom: 0.25rem;
    }
    .result-card .markdown-body { margin-top: 0.75rem; }
    .result-card .summary-text {
        border-left: 3px solid #6c757d;
        padding-left: 0.75rem;
        color: #495057;
        font-size: 0.95rem;
        white-space: pre-wrap;
    }
    .result-card .markdown-body pre {
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 1rem;
        border-radius: 0.375rem;
        overflow-x: auto;
    }
    .result-card .markdown-body code {
        background: #f0f0f0;
        padding: 0.15em 0.4em;
        border-radius: 0.25rem;
        font-size: 0.9em;
    }
    .result-card .markdown-body pre code {
        background: transparent;
        padding: 0;
    }
    .result-card .markdown-body table {
        width: 100%;
        border-collapse: collapse;
    }
    .result-card .markdown-body th, .result-card .markdown-body td {
        border: 1px solid #dee2e6;
        padding: 0.5rem 0.75rem;
    }
    .result-card .markdown-body th {
        background: #f8f9fa;
    }
    .metadata-table { font-size: 0.85rem; }
    .detail-section {
        margin-top: 0.75rem;
        border-top: 1px solid #e9ecef;
        padding-top: 0.75rem;
    }
    .detail-section .section-toggle {
        font-size: 0.85rem;
        cursor: pointer;
        user-select: none;
    }
    .detail-section .section-toggle:hover {
        text-decoration: underline;
    }
    .detail-section .section-body {
        margin-top: 0.5rem;
    }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-database me-2"></i>CtxHive
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-plus-circle me-2"></i>Store Content
                    </div>
                    <div class="card-body">
                        <form id="postForm">
                            <div class="row g-2 mb-3">
                                <div class="col-md-4">
                                    <label for="storeProjectName" class="form-label">Project</label>
                                    <input type="text" id="storeProjectName" class="form-control"
                                        placeholder="default">
                                </div>
                                <div class="col-md-8">
                                    <label for="storeTitle" class="form-label">Title</label>
                                    <input type="text" id="storeTitle" class="form-control"
                                        placeholder="Short human-readable title...">
                                </div>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-4">
                                    <label for="storeKind" class="form-label">Kind</label>
                                    <select id="storeKind" class="form-select">
                                        <option value="message" selected>Message</option>
                                        <option value="git_pr">Git PR</option>
                                        <option value="jira">Jira Issue</option>
                                    </select>
                                </div>
                                <div class="col-md-8">
                                    <label for="storeSummary" class="form-label">Summary <span class="text-danger">*</span></label>
                                    <textarea id="storeSummary" class="form-control" rows="2" required
                                        placeholder="Full description of this record — this text is embedded for semantic search..."></textarea>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="storeContent" class="form-label">Content <span class="text-danger">*</span></label>
                                <textarea id="storeContent" class="form-control" rows="6" required
                                    placeholder="Markdown content of the record..."></textarea>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label for="storeTags" class="form-label">Tags</label>
                                    <input type="text" id="storeTags" class="form-control"
                                        placeholder="comma, separated, tags">
                                </div>
                                <div class="col-md-6">
                                    <label for="storeSource" class="form-label">Source</label>
                                    <input type="text" id="storeSource" class="form-control"
                                        placeholder="e.g. https://...">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="storeMetadata" class="form-label">Metadata</label>
                                <textarea id="storeMetadata" class="form-control" rows="3"
                                    placeholder="key: value pairs, one per line..."></textarea>
                            </div>
                            <button type="submit" id="postBtn" class="btn btn-primary w-100">
                                <i class="bi bi-upload me-1"></i> Store Content
                            </button>
                        </form>
                        <div id="postResult" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <i class="bi bi-search me-2"></i>Search Contents
                    </div>
                    <div class="card-body">
                        <form id="queryForm">
                            <div class="mb-3">
                                <label for="queryInput" class="form-label">Search Query <span class="text-danger">*</span></label>
                                <input type="text" id="queryInput" class="form-control" required
                                    placeholder="Enter search text...">
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <label for="queryProjectName" class="form-label">Project</label>
                                    <input type="text" id="queryProjectName" class="form-control"
                                        placeholder="default">
                                </div>
                                <div class="col-md-3">
                                    <label for="queryTopK" class="form-label">Top K</label>
                                    <input type="number" id="queryTopK" class="form-control" min="1" placeholder="3">
                                </div>
                                <div class="col-md-3">
                                    <label for="queryMaxDistance" class="form-label">Max distance</label>
                                    <input type="number" id="queryMaxDistance" class="form-control" min="0" max="1" step="0.05"
                                        placeholder="0.9">
                                </div>
                            </div>
                            <button type="submit" id="queryBtn" class="btn btn-success w-100">
                                <i class="bi bi-search me-1"></i> Search
                            </button>
                        </form>
                        <div id="queryResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const postForm = document.getElementById('postForm');
    const queryForm = document.getElementById('queryForm');
    const postResult = document.getElementById('postResult');
    const queryResult = document.getElementById('queryResult');
    const postBtn = document.getElementById('postBtn');
    const queryBtn = document.getElementById('queryBtn');

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function showAlert(container, type, content) {
        container.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show mb-0" role="alert">
            ${content}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
    }

    // The server returns JSON on success and plain text on some errors.
    async function parseResponse(res) {
        const text = await res.text();
        try {
            return JSON.parse(text);
        } catch {
            return { error: text || res.statusText };
        }
    }

    function setLoading(btn, loading) {
        if (loading) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Processing...';
        }
    }

    function resetBtn(btn, icon, text) {
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-${icon} me-1"></i> ${text}`;
    }

    // Parses "key: value" lines from the metadata textarea into an object.
    function parseMetadata(raw) {
        const metadata = {};
        raw.split('\n').forEach(line => {
            const idx = line.indexOf(':');
            if (idx <= 0) return;
            const key = line.slice(0, idx).trim();
            const value = line.slice(idx + 1).trim();
            if (key) metadata[key] = value;
        });
        return metadata;
    }

    function buildStoreBody() {
        const body = {
            kind: document.getElementById('storeKind').value,
            summary: document.getElementById('storeSummary').value.trim(),
            content: document.getElementById('storeContent').value.trim(),
        };

        const projectName = document.getElementById('storeProjectName').value.trim();
        if (projectName) body.projectName = projectName;

        const title = document.getElementById('storeTitle').value.trim();
        if (title) body.title = title;

        const tags = document.getElementById('storeTags').value
            .split(',').map(t => t.trim()).filter(Boolean);
        if (tags.length) body.tags = tags;

        const source = document.getElementById('storeSource').value.trim();
        if (source) body.source = source;

        const metadata = parseMetadata(document.getElementById('storeMetadata').value);
        if (Object.keys(metadata).length) body.metadata = metadata;

        return body;
    }

    function clearStoreForm() {
        ['storeProjectName', 'storeTitle', 'storeSummary', 'storeContent',
         'storeTags', 'storeSource', 'storeMetadata'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('storeKind').value = 'message';
    }

    postForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = buildStoreBody();
        if (!body.summary) {
            showAlert(postResult, 'warning', '<i class="bi bi-exclamation-circle me-1"></i> Please provide a summary describing this record — it is used for semantic search.');
            return;
        }
        if (!body.content) {
            showAlert(postResult, 'warning', '<i class="bi bi-exclamation-circle me-1"></i> Please provide content to store.');
            return;
        }

        setLoading(postBtn, true);
        postResult.innerHTML = '';

        try {
            const res = await fetch('/content', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await parseResponse(res);
            if (res.ok) {
                showAlert(postResult, 'success', '<i class="bi bi-check-circle me-1"></i> Content stored successfully!');
                clearStoreForm();
            } else {
                showAlert(postResult, 'danger', `<i class="bi bi-exclamation-triangle me-1"></i> ${escapeHtml(data.error || 'Failed to store content')}`);
            }
        } catch (err) {
            showAlert(postResult, 'danger', `<i class="bi bi-exclamation-triangle me-1"></i> Network error: ${escapeHtml(err.message)}`);
        } finally {
            resetBtn(postBtn, 'upload', 'Store Content');
        }
    });

    queryForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = document.getElementById('queryInput').value.trim();
        if (!text) return;

        const body = {
            projectName: document.getElementById('queryProjectName').value.trim() || 'default',
            text,
        };
        const topK = parseInt(document.getElementById('queryTopK').value, 10);
        if (topK > 0) body.topK = topK;
        const maxDistance = parseFloat(document.getElementById('queryMaxDistance').value);
        if (maxDistance > 0) body.maxDistance = maxDistance;

        setLoading(queryBtn, true);
        queryResult.innerHTML = '';

        try {
            const res = await fetch('/content', {
                method: 'QUERY',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await parseResponse(res);
            if (res.ok && Array.isArray(data.results) && data.results.length > 0) {
                queryResult.innerHTML = renderResults(data.results);
            } else if (res.ok) {
                queryResult.innerHTML = `<div class="alert alert-info mb-0">
                    <i class="bi bi-info-circle me-1"></i> No results found for your query.
                </div>`;
            } else {
                showAlert(queryResult, 'danger', `<i class="bi bi-exclamation-triangle me-1"></i> ${escapeHtml(data.error || 'Search failed')}`);
            }
        } catch (err) {
            showAlert(queryResult, 'danger', `<i class="bi bi-exclamation-triangle me-1"></i> Network error: ${escapeHtml(err.message)}`);
        } finally {
            resetBtn(queryBtn, 'search', 'Search');
        }
    });

    function scoreBadge(dist) {
        const badgeColor = dist <= 0.3 ? 'bg-success'
            : dist <= 0.6 ? 'bg-info text-dark'
            : dist <= 0.9 ? 'bg-warning text-dark'
            : 'bg-danger';
        const label = dist <= 0.3 ? 'Strong match'
            : dist <= 0.6 ? 'Good match'
            : dist <= 0.9 ? 'Weak match'
            : 'Poor match';
        return `<span class="badge ${badgeColor} score-badge">
            <i class="bi bi-graph-up me-1"></i>${label} (distance: ${dist.toFixed(4)})
        </span>`;
    }

    function metadataTable(metadata) {
        const rows = Object.entries(metadata).map(([key, value]) => `
            <tr>
                <th scope="row" class="text-muted small text-nowrap w-25">${escapeHtml(key)}</th>
                <td>${escapeHtml(value)}</td>
            </tr>`).join('');
        return `<table class="table table-sm table-bordered metadata-table mb-0">
            <tbody>${rows}</tbody>
        </table>`;
    }

    function buildDetailSection(label, icon, innerHtml) {
        const id = 'section-' + Math.random().toString(36).substring(2, 10);
        return `<div class="detail-section">
            <div class="section-toggle text-muted" data-bs-toggle="collapse"
                 data-bs-target="#${id}" aria-expanded="false">
                <i class="bi bi-${icon} me-1"></i>${label}
                <i class="bi bi-chevron-down ms-1 small"></i>
            </div>
            <div class="collapse section-body" id="${id}">${innerHtml}</div>
        </div>`;
    }

    function renderResults(results) {
        let html = `<div class="d-flex align-items-center mb-3">
            <i class="bi bi-check-circle-fill text-success me-2"></i>
            <strong>Found ${results.length} result(s)</strong>
        </div>`;

        results.forEach((r, i) => {
            // The API nests the stored fields under r.document; r.score is the
            // vector distance (lower = more similar).
            const doc = r.document || {};
            const dist = Number(r.score);

            const title = doc.title && doc.title.trim() ? doc.title.trim() : 'Untitled';
            const kindBadge = doc.kind
                ? `<span class="badge text-bg-secondary"><i class="bi bi-tag me-1"></i>${escapeHtml(doc.kind)}</span>`
                : '';
            const badge = Number.isFinite(dist) ? scoreBadge(dist) : '';

            let tagsHtml = '';
            if (Array.isArray(doc.tags) && doc.tags.length) {
                tagsHtml = `<div>${doc.tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>`;
            }

            let sourceHtml = '';
            if (doc.source && doc.source.trim()) {
                const source = doc.source.trim();
                const link = /^https?:\/\//i.test(source)
                    ? `<a href="${escapeHtml(source)}" target="_blank" rel="noopener">${escapeHtml(source)}</a>`
                    : escapeHtml(source);
                sourceHtml = `<div class="text-muted small mb-2"><i class="bi bi-link-45deg me-1"></i>${link}</div>`;
            }

            let metadataHtml = '';
            if (doc.metadata && typeof doc.metadata === 'object' && Object.keys(doc.metadata).length) {
                metadataHtml = buildDetailSection('Metadata', 'card-list', metadataTable(doc.metadata));
            }

            const summaryHtml = doc.summary && doc.summary.trim()
                ? `<div class="summary-text mb-2">${escapeHtml(doc.summary.trim())}</div>`
                : '';

            html += `<div class="result-card">
                <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
                    <div>
                        <span class="text-muted small me-2">Result #${i + 1}</span>
                        ${kindBadge}
                        <strong>${escapeHtml(title)}</strong>
                    </div>
                    ${badge}
                </div>
                ${sourceHtml}${tagsHtml}${summaryHtml}
                <div class="markdown-body">${marked.parse(doc.content || '')}</div>${metadataHtml}
            </div>`;
        });

        return html;
    }
    </script>
</body>
</html>
