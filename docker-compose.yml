services:
  # CtxHive API — built from the local Dockerfile first, then started only
  # after every backend below reports healthy. The only service exposed
  # to the host; everything else lives on the internal network.
  ctx_hive:
    container_name: ctxhive
    build:
      context: .
      dockerfile: Dockerfile
    image: ctxhive:latest
    restart: unless-stopped
    environment:
      CTXHIVE_MILVUS_ADDR: standalone:19530
      CTXHIVE_OLLAMA_ADDR: http://ollama:11434
      CTXHIVE_PORT: "8080"
      CTXHIVE_EMBED_MODEL: nomic-embed-text:v1.5
      CTXHIVE_CAPACITY: "65535"
      CTXHIVE_DIM: "768"
    ports:
      - "8080:8080"
    networks:
      - internal
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
      standalone:
        condition: service_healthy
      ollama:
        condition: service_healthy

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    networks:
      - internal
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.19
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - internal
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
    dns:
      - 1.1.1.1
      - 8.8.8.8
    gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      start_period: 15s
      timeout: 5s
      retries: 6

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  ollama_data:

networks:
  internal:
    name: ctxhive_internal
